<!doctype html>
<title>Link click test</title>
<style>
  body { margin: 0 }
  a { display: block; padding: 40px; width: 200px; height: 20px }
</style>
<a href="http://example.test/plain">plain</a>
<a id="cancel" href="http://example.test/cancel"><span>cancelled</span></a>
<a id="rewrite" href="http://example.test/original">rewritten</a>
<a href="http://example.test/clicked"><span id="moved">moved</span></a>
<a id="elsewhere" href="http://example.test/elsewhere"></a>
<a id="late">late</a>
<script>
  document.getElementById("cancel").addEventListener("click", (e) => {
    e.preventDefault();
    console.log("cancelled");
  });
  document.getElementById("rewrite").addEventListener("click", (e) => {
    e.currentTarget.href = "http://example.test/rewritten";
  });
  document.getElementById("moved").addEventListener("click", (e) => {
    document.getElementById("elsewhere").appendChild(e.currentTarget);
    console.log("moved into " + e.currentTarget.parentNode.id);
  });
  document.getElementById("late").addEventListener("click", (e) => {
    e.currentTarget.href = "http://example.test/late";
  });
</script>
